name: Amazonia CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API - testes, migrações e compilação
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validar migrações
        run: alembic upgrade head
      - name: Executar testes
        run: pytest
      - name: Verificar sintaxe
        run: python -m compileall -q app migrations
  web:
    name: Web - typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependências
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
