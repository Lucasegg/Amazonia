name: Amazonia CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API - testes, migrações e compilação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validar migrações
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head
      - name: Executar testes
        run: pytest
      - name: Verificar sintaxe
        run: python -m compileall -q app migrations
